name: AWS Inventory App Deployment

on:
  push:
    branches:
      - main # Triggers the pipeline on every push event to the main branch

permissions:
  id-token: write   # Required for secure AWS OIDC authentication configurations
  contents: read    # Required to check out the repository source code

jobs:
  deploy:
    name: Build, Provision & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the application source code (Upgraded to v5)
      - name: Checkout Source Code
        uses: actions/checkout@v5

      # 2. Set up Node.js environment (Upgraded to v5)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # 3. Securely authenticate with Amazon Web Services
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0 # Updated version natively supporting Node 24
        with:
          aws-region: eu-central-1
          # Recommended Best Practice: Transition to IAM Role OIDC instead of long-lived Secrets
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 4. Initialize and install the Terraform CLI on the runner
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3.1.2 # Updated version natively supporting Node 24
        with:
          terraform_version: "1.5.7" # Specifies your designated Terraform execution version

      # 5. Provision Infrastructure as Code (IaC)
      - name: Terraform Initialize and Apply
        run: |
          cd terraform
          terraform init
          terraform apply --auto-approve

      # 6. Install dependencies and compile frontend production bundle
      - name: Build Frontend Application
        run: |
          cd frontend
          npm ci
          npm run build

      # 7. Synchronize static frontend distribution assets to the Amazon S3 Bucket
      - name: Sync Frontend Assets to Amazon S3
        run: |
          # Fetch the dynamic S3 bucket name directly from the output of the applied Terraform state
          BUCKET_NAME=$(cd terraform && terraform output -raw frontend_bucket_name)
          
          # Synchronize build assets with the destination bucket while purging deprecated files
          aws s3 sync ./frontend/dist s3://$BUCKET_NAME --delete
